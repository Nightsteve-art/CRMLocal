{% extends "layout.html" %}

{% block title %}Новый контрагент • Eko-Production{% endblock %}

{% block content %}
<div class="fade-in">
    <!-- Breadcrumb 
    <div class="breadcrumb">
        <a href="{{ url_for('dashboard') }}" class="breadcrumb-link">
            <i class="fas fa-home"></i>
            Главная
        </a>
        <span class="breadcrumb-separator"><i class="fas fa-chevron-right"></i></span>
        <a href="{{ url_for('counterparties') }}" class="breadcrumb-link">
            Контрагенты
        </a>
        <span class="breadcrumb-separator"><i class="fas fa-chevron-right"></i></span>
        <span class="breadcrumb-item">Новый контрагент</span>
    </div>-->

    <!-- Form Card -->
    <div class="form-card">
        <div class="form-header">
            <h2>
                <i class="fas fa-user-plus" style="color: var(--primary);"></i>
                Новый контрагент
            </h2>
            <p>Заполните информацию о новом контрагенте</p>
        </div>

        <form method="POST" action="{{ url_for('create_counterparty') }}" id="counterpartyForm">
            <!-- Основная информация -->
            <div class="form-section">
                <div class="form-section-title">
                    <i class="fas fa-info-circle"></i>
                    Основная информация
                </div>
                
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label" for="name">
                            Название компании <span style="color: var(--status-red);">*</span>
                        </label>
                        <input type="text" 
                               class="form-control" 
                               id="name" 
                               name="name" 
                               required
                               placeholder="Введите название компании"
                               autofocus>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="contact_person">
                            Контактное лицо
                        </label>
                        <input type="text" 
                               class="form-control" 
                               id="contact_person" 
                               name="contact_person" 
                               placeholder="ФИО контактного лица">
                    </div>
                </div>
            </div>

            <!-- Контактная информация -->
            <div class="form-section">
                <div class="form-section-title">
                    <i class="fas fa-address-card"></i>
                    Контактная информация
                </div>
                
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label" for="email">
                            Email
                        </label>
                        <input type="email" 
                               class="form-control" 
                               id="email" 
                               name="email" 
                               placeholder="email@example.com">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="phone">
                            Телефон
                        </label>
                        <input type="tel" 
                               class="form-control" 
                               id="phone" 
                               name="phone" 
                               placeholder="+7 (XXX) XXX-XX-XX">
                    </div>
                </div>
            </div>

            <!-- Адрес -->
            <div class="form-section">
                <div class="form-section-title">
                    <i class="fas fa-map-marker-alt"></i>
                    Адрес
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="address">
                        Адрес
                    </label>
                    <textarea class="form-control" 
                              id="address" 
                              name="address" 
                              rows="3"
                              placeholder="Полный юридический или физический адрес"></textarea>
                </div>
            </div>

            <!-- Form Actions -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--gray-200);">
                <div>
                    <span style="font-size: 0.75rem; color: var(--gray-500);">
                        <span style="color: var(--status-red);">*</span> Обязательные поля
                    </span>
                </div>
                <div style="display: flex; gap: 0.75rem;">
                    <a href="{{ url_for('counterparties') }}" class="btn btn-secondary">
                        <i class="fas fa-times"></i>
                        <span>Отмена</span>
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i>
                        <span>Сохранить контрагента</span>
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
document.getElementById('counterpartyForm').addEventListener('submit', function(e) {
    const requiredFields = this.querySelectorAll('[required]');
    let isValid = true;
    
    requiredFields.forEach(field => {
        if (!field.value.trim()) {
            field.style.borderColor = 'var(--status-red)';
            field.style.boxShadow = '0 0 0 3px rgba(239, 68, 68, 0.1)';
            isValid = false;
            
            // Show error message
            let error = field.parentNode.querySelector('.field-error');
            if (!error) {
                error = document.createElement('div');
                error.className = 'field-error';
                error.style.cssText = 'color: var(--status-red); font-size: 0.75rem; margin-top: 0.25rem;';
                field.parentNode.appendChild(error);
            }
            error.textContent = 'Это поле обязательно';
        }
    });
    
    if (!isValid) {
        e.preventDefault();
        showNotification('Пожалуйста, заполните все обязательные поля', 'error');
    }
});

// Clear errors on input
document.querySelectorAll('[required]').forEach(field => {
    field.addEventListener('input', function() {
        this.style.borderColor = '';
        this.style.boxShadow = '';
        const error = this.parentNode.querySelector('.field-error');
        if (error) error.remove();
    });
});

// Phone number formatting
document.getElementById('phone')?.addEventListener('input', function(e) {
    let value = this.value.replace(/\D/g, '');
    
    if (value.length > 0) {
        if (!value.startsWith('7') && !value.startsWith('8')) {
            value = '7' + value;
        }
        
        let formatted = '+7 ';
        
        if (value.length > 1) {
            formatted += '(' + value.substring(1, 4);
        }
        if (value.length >= 4) {
            formatted += ') ' + value.substring(4, 7);
        }
        if (value.length >= 7) {
            formatted += '-' + value.substring(7, 9);
        }
        if (value.length >= 9) {
            formatted += '-' + value.substring(9, 11);
        }
        
        this.value = formatted;
    }
});
</script>

<style>
    .form-card {
        animation: slideUp 0.3s ease;
    }
    
    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    /* Responsive styles */
    @media (max-width: 768px) {
        .form-card {
            padding: 1rem;
        }
        
        .form-section {
            padding: 1rem;
        }
    }
</style>
{% endblock %}
