{% extends "layout_new.html" %}
{% block title %}Пользователи - Eko CRM{% endblock %}
{% block content %}
<div style="padding: var(--spacing-xl) 0;">

        <h1>Пользователи</h1>
        <button class="btn btn-primary">➕ Добавить пользователя</button>
    </div>
    
    <div class="card">
        <div class="card__body">
            <table class="table">
                <thead>
                    <tr>
                        <th>Имя</th>
                        <th>Email</th>
                        <th>Роль</th>
                        <th>Статус</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><strong>Иван Петров</strong></td>
                        <td>ivan@company.ru</td>
                        <td><span class="badge badge-primary">Администратор</span></td>
                        <td><span class="status status--active"><span class="status__dot"></span>Активен</span></td>
                        <td><a href="#" style="color: var(--primary);">Редактировать</a></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
