{% extends "layout_new.html" %}
{% block title %}Калькулятор - Eko CRM{% endblock %}
{% block content %}
<div style="padding: var(--spacing-xl) 0; max-width: 600px;">
    <h1 style="margin-bottom: var(--spacing-lg);">Калькулятор стоимости</h1>
    <div class="card">
        <div class="card__body">
            <form style="display: flex; flex-direction: column; gap: var(--spacing-lg);">
                <div class="form-group">
                    <label class="form-group__label">Тип продукции</label>
                    <select class="form-input">
                        <option>Хоккейные борта</option>
                        <option>Разделители</option>
                        <option>Защитные маты</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-group__label">Размер (м)</label>
                    <input type="number" class="form-input" placeholder="100">
                </div>
                <button type="submit" class="btn btn-primary">Рассчитать</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
