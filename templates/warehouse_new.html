{% extends "layout_new.html" %}
{% block title %}Склад - Eko CRM{% endblock %}
{% block content %}
<div style="padding: var(--spacing-xl) 0;">
    <h1 style="margin-bottom: var(--spacing-lg);">Склад</h1>
    
    <div class="grid grid-3" style="margin-bottom: var(--spacing-lg);">
        <div class="card">
            <div class="card__body">
                <div class="metric-card">
                    <div class="metric-card__icon">📦</div>
                    <div class="metric-card__value">45</div>
                    <div class="metric-card__label">Наименований</div>
                </div>
            </div>
        </div>
        <div class="card">
            <div class="card__body">
                <div class="metric-card">
                    <div class="metric-card__icon">⚠️</div>
                    <div class="metric-card__value">3</div>
                    <div class="metric-card__label">Дефицитов</div>
                </div>
            </div>
        </div>
        <div class="card">
            <div class="card__body">
                <div class="metric-card">
                    <div class="metric-card__icon">📥</div>
                    <div class="metric-card__value">5</div>
                    <div class="metric-card__label">Поступлений</div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="card">
        <div class="card__header">
            <h3 class="card__title">Остатки материалов</h3>
        </div>
        <div class="card__body">
            <table class="table">
                <thead>
                    <tr>
                        <th>Материал</th>
                        <th>Остаток</th>
                        <th>Резерв</th>
                        <th>Свободно</th>
                        <th>Статус</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Металл 40x20</td>
                        <td>200 м</td>
                        <td>150 м</td>
                        <td>50 м</td>
                        <td><span class="badge badge-success">OK</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
