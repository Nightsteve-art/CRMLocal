{% extends "layout_new.html" %}
{% block title %}Швейка - Eko CRM{% endblock %}
{% block content %}
<div style="padding: var(--spacing-xl) 0;">
    <h1 style="margin-bottom: var(--spacing-lg);">Швейный цех</h1>
    
    <div class="grid grid-3" style="margin-bottom: var(--spacing-lg);">
        <div class="card">
            <div class="card__body">
                <div class="metric-card">
                    <div class="metric-card__icon">✂️</div>
                    <div class="metric-card__value">8</div>
                    <div class="metric-card__label">Мои задачи</div>
                </div>
            </div>
        </div>
        <div class="card">
            <div class="card__body">
                <div class="metric-card">
                    <div class="metric-card__icon">🔴</div>
                    <div class="metric-card__value">2</div>
                    <div class="metric-card__label">В работе</div>
                </div>
            </div>
        </div>
        <div class="card">
            <div class="card__body">
                <div class="metric-card">
                    <div class="metric-card__icon">⏳</div>
                    <div class="metric-card__value">6</div>
                    <div class="metric-card__label">В очереди</div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="card">
        <div class="card__header">
            <h3 class="card__title">Мои текущие задачи</h3>
        </div>
        <div class="card__body">
            <div style="display: flex; flex-direction: column; gap: var(--spacing-lg);">
                <div style="padding: var(--spacing-md); border: 1px solid var(--neutral-200); border-radius: var(--radius-md);">
                    <div style="display: flex; justify-content: space-between; margin-bottom: var(--spacing-sm);">
                        <h4 style="margin: 0;">Комплект гашения #123</h4>
                        <span class="badge badge-primary">50%</span>
                    </div>
                    <div style="font-size: 12px; color: var(--neutral-600);">ООО Спорт • Срок: сегодня</div>
                    <div class="progress" style="margin-top: var(--spacing-md);">
                        <div class="progress__bar" style="width: 50%;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
