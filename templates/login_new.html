{% extends "layout_new.html" %}
{% block title %}Вход - Eko CRM{% endblock %}
{% block content %}
<div style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--neutral-50);">
    <div class="card" style="max-width: 400px; width: 90%;">
        <div class="card__body" style="text-align: center;">
            <div style="font-size: 48px; margin-bottom: var(--spacing-lg);">🏒</div>
            <h1 style="margin-bottom: var(--spacing-lg);">Eko CRM</h1>
            <form style="display: flex; flex-direction: column; gap: var(--spacing-lg);">
                <div class="form-group">
                    <input type="email" class="form-input" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <input type="password" class="form-input" placeholder="Пароль" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Вход</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
