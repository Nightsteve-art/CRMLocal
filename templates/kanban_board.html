<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Доска производства</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/kanban.css') }}">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ice: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 900: '#0c4a6e' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex flex-col overflow-hidden">
  <header class="bg-white border-b border-slate-200 shadow-sm flex-none z-20">
    <div class="max-w-full px-4 sm:px-6 py-3 flex items-center justify-between flex-wrap gap-2">
      <div class="flex items-center gap-3">
        <!-- Кнопка НАЗАД на главную -->
        <a href="{{ url_for('home') }}" 
           class="inline-flex items-center gap-2 px-3 py-2 text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-50 transition">
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
          <span>На главную</span>
        </a>
        <div class="bg-ice-600 text-white p-2 rounded-lg"><i data-lucide="construction" class="w-6 h-6"></i></div>
        <div>
          <h1 class="text-lg sm:text-xl font-bold text-slate-900">Производство бортов</h1>
          <p class="text-xs text-slate-500">Доска производства</p>
        </div>
      </div>
      <div class="flex items-center gap-2 flex-wrap">
        <button onclick="app.openProjectModal()" class="inline-flex items-center gap-2 px-3 py-2 text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-50"><i data-lucide="briefcase" class="w-4 h-4"></i><span>Проекты</span></button>
        <button onclick="app.openDashboardModal()" class="inline-flex items-center gap-2 px-3 py-2 text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-50"><i data-lucide="layout-dashboard" class="w-4 h-4"></i><span>Сводка</span></button>
        <button onclick="app.openFieldEditorModal()" class="inline-flex items-center gap-2 px-3 py-2 text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-50"><i data-lucide="settings" class="w-4 h-4"></i><span>Настроить поля</span></button>
        <button onclick="app.openSaveTemplateModal()" class="inline-flex items-center gap-2 px-3 py-2 text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-50"><i data-lucide="save" class="w-4 h-4"></i><span>Сохранить шаблон</span></button>
        <button onclick="app.openTemplatesModal()" class="inline-flex items-center gap-2 px-3 py-2 text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded-lg"><i data-lucide="layout-template" class="w-4 h-4"></i><span>Шаблоны</span></button>
        <button onclick="app.openCardModal()" class="inline-flex items-center gap-2 px-3 py-2 text-sm font-medium text-white bg-ice-600 rounded-lg shadow-sm"><i data-lucide="plus" class="w-4 h-4"></i><span>Новая задача</span></button>
      </div>
    </div>
  </header>

  <div class="bg-white/80 backdrop-blur border-b border-slate-200 flex-none z-10">
    <div class="px-4 sm:px-6 py-2 flex items-center justify-between gap-2 overflow-x-auto no-scrollbar">
      <div class="flex items-center gap-2">
        <button onclick="app.addColumnPrompt()" class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-slate-600 bg-slate-100 rounded-md hover:bg-slate-200"><i data-lucide="columns" class="w-3.5 h-3.5"></i>Добавить этап</button>
        <span id="boardStats" class="text-xs text-slate-500">Загрузка...</span>
      </div>
      <div id="projectSelector" class="flex items-center gap-2"></div>
    </div>
  </div>

  <main class="flex-1 overflow-x-auto overflow-y-hidden bg-slate-50/50">
    <div id="board" class="flex gap-4 px-4 sm:px-6 py-4 h-full" style="flex-wrap: nowrap;"></div>
  </main>

  <!-- Модалка карточки -->
  <div id="cardModal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm" onclick="app.closeCardModal()"></div>
    <div class="absolute inset-0 flex items-center justify-center p-4 pointer-events-none">
      <div class="bg-white rounded-xl shadow-2xl w-full max-w-4xl pointer-events-auto flex flex-col max-h-[90vh]">
        <div class="px-5 py-4 border-b flex justify-between items-center flex-none">
          <h3 id="cardModalTitle" class="text-lg font-semibold">Задача</h3>
          <button onclick="app.closeCardModal()"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <div class="flex-1 overflow-y-auto p-5">
          <input type="hidden" id="cardId">
          <form id="cardForm" class="space-y-5">
            <div id="dynamicFields"></div>
            <div class="border-t pt-4 mt-2">
              <div class="font-medium text-sm mb-3">Комментарии и файлы</div>
              <div class="bg-slate-50 rounded-lg p-3 mb-4">
                <textarea id="newCommentText" rows="2" class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="Текст комментария..."></textarea>
                <div class="flex items-center justify-between mt-2 flex-wrap gap-2">
                  <label class="flex items-center gap-2 text-sm"><input type="checkbox" id="commentUrgent"> <span class="text-red-500">Срочный комментарий</span></label>
                  <div class="flex gap-2 items-center">
                    <input type="file" id="commentFiles" multiple class="text-sm">
                    <button type="button" onclick="app.addComment()" class="px-3 py-1.5 text-sm bg-ice-600 text-white rounded-lg">Отправить</button>
                  </div>
                </div>
              </div>
              <div id="commentsList" class="space-y-3 max-h-60 overflow-y-auto"></div>
            </div>
          </form>
        </div>
        <div class="px-5 py-4 border-t flex justify-between items-center bg-slate-50 rounded-b-xl flex-none">
          <button onclick="app.deleteCurrentCard()" id="deleteCardBtn" class="text-red-600 text-sm font-medium hidden">Удалить</button>
          <div class="ml-auto flex gap-2">
            <button onclick="app.closeCardModal()" class="px-4 py-2 text-sm border rounded-lg">Отмена</button>
            <button onclick="app.saveCard()" class="px-4 py-2 text-sm bg-ice-600 text-white rounded-lg">Сохранить</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Модалка предпросмотра изображений -->
  <div id="imagePreviewModal" class="fixed inset-0 z-50 hidden bg-black/80 flex items-center justify-center">
    <div class="relative max-w-4xl max-h-full p-4">
      <button onclick="app.closeImagePreview()" class="absolute top-2 right-2 text-white text-3xl">&times;</button>
      <img id="previewImage" src="" class="max-w-full max-h-screen object-contain">
    </div>
  </div>

  <!-- Модалка настройки полей -->
  <div id="fieldEditorModal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-slate-900/50" onclick="app.closeFieldEditorModal()"></div>
    <div class="absolute inset-0 flex items-center justify-center p-4 pointer-events-none">
      <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl pointer-events-auto flex flex-col max-h-[80vh]">
        <div class="px-5 py-4 border-b flex justify-between">
          <h3 class="text-lg font-semibold">Настройка полей карточки</h3>
          <button onclick="app.closeFieldEditorModal()"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <div class="flex-1 overflow-y-auto p-5">
          <div id="fieldsList" class="space-y-3"></div>
          <button onclick="app.addCustomField()" class="mt-4 w-full py-2 border border-dashed rounded-lg text-sm text-ice-600">+ Добавить поле</button>
        </div>
        <div class="px-5 py-4 border-t flex justify-end gap-2 bg-slate-50">
          <button onclick="app.closeFieldEditorModal()" class="px-4 py-2 text-sm border rounded-lg">Закрыть</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Модалка проектов -->
  <div id="projectModal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-slate-900/50" onclick="app.closeProjectModal()"></div>
    <div class="absolute inset-0 flex items-center justify-center p-4 pointer-events-none">
      <div class="bg-white rounded-xl shadow-2xl w-full max-w-md pointer-events-auto">
        <div class="px-5 py-4 border-b flex justify-between">
          <h3 class="text-lg font-semibold">Проекты</h3>
          <button onclick="app.closeProjectModal()"><i data-lucide="x"></i></button>
        </div>
        <div class="p-5">
          <div id="projectsList" class="space-y-2 max-h-80 overflow-y-auto"></div>
          <button onclick="app.createProject()" class="mt-4 w-full py-2 border border-dashed rounded-lg">+ Новый проект</button>
        </div>
        <div class="px-5 py-4 border-t bg-slate-50 rounded-b-xl flex justify-end">
          <button onclick="app.closeProjectModal()" class="px-4 py-2 text-sm border rounded-lg">Закрыть</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Модалка сводки проектов -->
  <div id="dashboardModal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-slate-900/50" onclick="app.closeDashboardModal()"></div>
    <div class="absolute inset-0 flex items-center justify-center p-4 pointer-events-none">
      <div class="bg-white rounded-xl shadow-2xl w-full max-w-4xl pointer-events-auto max-h-[85vh] overflow-y-auto">
        <div class="px-5 py-4 border-b sticky top-0 bg-white flex justify-between">
          <h3 class="text-lg font-semibold">Сводка по проектам</h3>
          <button onclick="app.closeDashboardModal()"><i data-lucide="x"></i></button>
        </div>
        <div id="dashboardContent" class="p-5"></div>
      </div>
    </div>
  </div>

  <!-- Модалка шаблонов -->
  <div id="templatesModal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-slate-900/50" onclick="app.closeTemplatesModal()"></div>
    <div class="absolute inset-0 flex items-center justify-center p-4 pointer-events-none">
      <div class="bg-white rounded-xl shadow-2xl w-full max-w-md pointer-events-auto">
        <div class="px-5 py-4 border-b flex justify-between">
          <h3 class="text-lg font-semibold">Шаблоны</h3>
          <button onclick="app.closeTemplatesModal()"><i data-lucide="x"></i></button>
        </div>
        <div class="p-5">
          <div id="templatesList" class="space-y-2"></div>
          <div id="emptyTemplates" class="hidden text-center py-6 text-slate-500">Нет шаблонов</div>
        </div>
        <div class="px-5 py-4 border-t bg-slate-50 rounded-b-xl flex justify-end">
          <button onclick="app.closeTemplatesModal()" class="px-4 py-2 border rounded-lg">Закрыть</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Модалка сохранения шаблона -->
  <div id="saveTemplateModal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-slate-900/50" onclick="app.closeSaveTemplateModal()"></div>
    <div class="absolute inset-0 flex items-center justify-center p-4 pointer-events-none">
      <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm pointer-events-auto">
        <div class="px-5 py-4 border-b">
          <h3 class="text-lg font-semibold">Сохранить шаблон</h3>
        </div>
        <div class="p-5">
          <label class="block text-sm">Название</label>
          <input type="text" id="templateNameInput" class="w-full mt-1 px-3 py-2 border rounded-lg">
        </div>
        <div class="px-5 py-4 border-t bg-slate-50 rounded-b-xl flex justify-end gap-2">
          <button onclick="app.closeSaveTemplateModal()" class="px-4 py-2 border rounded-lg">Отмена</button>
          <button onclick="app.confirmSaveTemplate()" class="px-4 py-2 bg-ice-600 text-white rounded-lg">Сохранить</button>
        </div>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/kanban.js') }}"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      app.init();
      lucide.createIcons();
    });
  </script>
</body>
</html>
