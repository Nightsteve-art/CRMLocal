{% extends "layout_new.html" %}
{% block title %}Заказы - Eko CRM{% endblock %}
{% block content %}
<div style="padding: var(--spacing-xl) 0;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-lg);">
        <h1>Заказы</h1>
        <button class="btn btn-primary">➕ Новый заказ</button>
    </div>
    
    <div class="card">
        <div class="card__body">
            <div style="display: flex; gap: var(--spacing-md); margin-bottom: var(--spacing-lg);">
                <input type="text" class="form-input" placeholder="Поиск по номеру или клиенту..." style="flex: 1;">
                <select class="form-input" style="max-width: 150px;">
                    <option>Все статусы</option>
                    <option>На рассмотрении</option>
                    <option>В работе</option>
                    <option>Готово</option>
                </select>
                <button class="btn btn-secondary">🔍 Фильтр</button>
            </div>
            
            <table class="table">
                <thead>
                    <tr>
                        <th>Номер</th>
                        <th>Клиент</th>
                        <th>Статус</th>
                        <th>Срок</th>
                        <th>Готовность</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><strong>#456</strong></td>
                        <td>ООО Спорт</td>
                        <td><span class="badge badge-primary">На рассм.</span></td>
                        <td>5 дней</td>
                        <td><div class="progress" style="width: 100px;"><div class="progress__bar" style="width: 75%;"></div></div></td>
                        <td><a href="/orders/456" style="color: var(--primary); text-decoration: none;">Открыть</a></td>
                    </tr>
                    <tr>
                        <td><strong>#789</strong></td>
                        <td>РЦ Хоккей</td>
                        <td><span class="badge badge-primary">В работе</span></td>
                        <td>2 дня</td>
                        <td><div class="progress" style="width: 100px;"><div class="progress__bar" style="width: 45%;"></div></div></td>
                        <td><a href="/orders/789" style="color: var(--primary); text-decoration: none;">Открыть</a></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
