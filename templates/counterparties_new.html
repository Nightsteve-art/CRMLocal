{% extends "layout_new.html" %}
{% block title %}Контрагенты - Eko CRM{% endblock %}
{% block content %}
<div style="padding: var(--spacing-xl) 0;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-lg);">
        <h1>Контрагенты</h1>
        <button class="btn btn-primary">➕ Добавить</button>
    </div>
    
    <div class="grid grid-3">
        <div class="card">
            <div class="card__body">
                <h4>ООО Спорт</h4>
                <div style="font-size: 12px; color: var(--neutral-600); margin: var(--spacing-md) 0;">
                    <div>📞 +7 (911) 123-45-67</div>
                    <div>📧 info@sport.ru</div>
                </div>
                <div style="display: flex; gap: var(--spacing-sm);">
                    <button class="btn btn-secondary btn-sm">Редактировать</button>
                    <button class="btn btn-secondary btn-sm">Удалить</button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
