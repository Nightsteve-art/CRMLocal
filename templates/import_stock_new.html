{% extends "layout_new.html" %}
{% block title %}Импорт остатков - Eko CRM{% endblock %}
{% block content %}
<div style="padding: var(--spacing-xl) 0; max-width: 600px;">
    <h1 style="margin-bottom: var(--spacing-lg);">Импорт остатков</h1>
    <div class="card">
        <div class="card__body">
            <form style="display: flex; flex-direction: column; gap: var(--spacing-lg);">
                <div class="form-group">
                    <label class="form-group__label">Загрузить файл Excel</label>
                    <input type="file" class="form-input" accept=".xlsx,.xls">
                </div>
                <button type="submit" class="btn btn-primary">Импортировать</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
