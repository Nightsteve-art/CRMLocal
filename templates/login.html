<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход • Eko-Production</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Login page specific styles */
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            padding: 1rem;
        }
        
        .login-card {
            background: var(--white);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-2xl);
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            border: 1px solid var(--gray-200);
            animation: slideUp 0.5s ease;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .login-logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 1rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-size: 1.5rem;
            box-shadow: 0 8px 24px rgba(30, 64, 175, 0.3);
        }
        
        .login-title {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--gray-900);
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }
        
        .login-subtitle {
            font-size: 0.875rem;
            color: var(--gray-600);
        }
        
        .login-form .form-group {
            margin-bottom: 1.25rem;
        }
        
        .login-form .form-label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .login-form .form-control {
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius-md);
            transition: all 0.3s ease;
        }
        
        .login-form .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1);
        }
        
        .login-btn {
            width: 100%;
            padding: 0.875rem;
            font-size: 0.875rem;
            font-weight: 600;
            margin-top: 1rem;
            background: var(--gradient-primary);
            border: none;
            border-radius: var(--radius-md);
            color: var(--white);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .login-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(30, 64, 175, 0.3);
        }
        
        .login-btn:active {
            transform: translateY(0);
        }
        
        .demo-credentials {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--gray-200);
        }
        
        .demo-header {
            text-align: center;
            font-size: 0.75rem;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
        }
        
        .demo-card {
            background: var(--gray-50);
            border-radius: var(--radius-md);
            padding: 1rem;
            border: 1px solid var(--gray-200);
            margin-bottom: 1rem;
        }
        
        .demo-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
        }
        
        .demo-row:last-child {
            margin-bottom: 0;
        }
        
        .demo-label {
            font-size: 0.75rem;
            color: var(--gray-600);
            min-width: 60px;
        }
        
        .demo-value {
            font-weight: 600;
            color: var(--gray-800);
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 0.75rem;
        }
        
        .demo-fill-btn {
            width: 100%;
            padding: 0.75rem;
            background: var(--white);
            border: 2px solid var(--gray-200);
            border-radius: var(--radius-md);
            color: var(--gray-700);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        
        .demo-fill-btn:hover {
            background: var(--gray-50);
            border-color: var(--primary);
            color: var(--primary);
        }
        
        .alert-error {
            background: var(--status-red-light);
            border: 1px solid var(--status-red);
            color: var(--status-red);
            padding: 0.75rem 1rem;
            border-radius: var(--radius-md);
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        /* Responsive adjustments */
        @media (max-width: 480px) {
            .login-card {
                padding: 1.5rem;
            }
            
            .login-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <i class="fas fa-bolt"></i>
                </div>
                <h1 class="login-title">Eko-Production</h1>
                <p class="login-subtitle">Система управления коммерческими предложениями</p>
            </div>
            
            {% if error %}
            <div class="alert-error">
                <i class="fas fa-exclamation-circle"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}
            
            <form method="POST" action="{{ url_for('login') }}" class="login-form" id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="username">
                        <i class="fas fa-user"></i>
                        Логин
                    </label>
                    <input type="text" 
                           id="username" 
                           name="username" 
                           class="form-control" 
                           placeholder="Введите логин"
                           required
                           autocomplete="username"
                           autofocus>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">
                        <i class="fas fa-lock"></i>
                        Пароль
                    </label>
                    <input type="password" 
                           id="password" 
                           name="password" 
                           class="form-control" 
                           placeholder="Введите пароль"
                           required
                           autocomplete="current-password">
                </div>
                
                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i>
                    <span>Войти в систему</span>
                </button>
                
                <!-- Demo credentials 
                <div class="demo-credentials">
                    <div class="demo-header">Демо доступ</div>
                    
                    <div class="demo-card">
                        <div class="demo-row">
                            <div class="demo-label">Логин:</div>
                            <div class="demo-value">admin</div>
                        </div>
                        <div class="demo-row">
                            <div class="demo-label">Пароль:</div>
                            <div class="demo-value">Alex4815162342</div>
                        </div>
                    </div>
                    
                    <button type="button" class="demo-fill-btn" onclick="fillDemoCredentials()">
                        <i class="fas fa-magic"></i>
                        Заполнить демо данные
                    </button>
                </div>-->
            </form>
        </div>
    </div>

    <script>
        // Fill demo credentials
        function fillDemoCredentials() {
            document.getElementById('username').value = 'admin';
            document.getElementById('password').value = 'Alex4815162342';
            
            // Add visual feedback
            const inputs = document.querySelectorAll('.form-control');
            inputs.forEach(input => {
                input.style.borderColor = 'var(--primary)';
                input.style.boxShadow = '0 0 0 3px rgba(30, 64, 175, 0.1)';
                
                setTimeout(() => {
                    input.style.borderColor = '';
                    input.style.boxShadow = '';
                }, 1000);
            });
            
            // Show success message
            const successMsg = document.createElement('div');
            successMsg.className = 'alert-error';
            successMsg.style.cssText = 'background: var(--status-green-light); border-color: var(--status-green); color: var(--status-green); margin-top: 1rem;';
            successMsg.innerHTML = `<i class="fas fa-check-circle"></i><span>Демо данные заполнены. Нажмите "Войти в систему"</span>`;
            
            const form = document.getElementById('loginForm');
            form.insertBefore(successMsg, form.querySelector('.login-btn'));
            
            setTimeout(() => {
                successMsg.style.opacity = '0';
                successMsg.style.transform = 'translateY(-10px)';
                setTimeout(() => successMsg.remove(), 300);
            }, 3000);
        }
        
        // Form submission animation
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const submitBtn = this.querySelector('button[type="submit"]');
            const originalHTML = submitBtn.innerHTML;
            
            // Show loading state
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>Вход...</span>';
            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.8';
            
            // Reset after 5 seconds if something goes wrong
            setTimeout(() => {
                submitBtn.innerHTML = originalHTML;
                submitBtn.disabled = false;
                submitBtn.style.opacity = '1';
            }, 5000);
        });
        
        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            // Enter to submit
            if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
                const form = document.getElementById('loginForm');
                if (form.checkValidity()) {
                    form.querySelector('button[type="submit"]').click();
                }
            }
            
            // F1 to fill demo credentials
            if (e.key === 'F1') {
                e.preventDefault();
                fillDemoCredentials();
            }
        });
        
        // Focus first input on load
        document.getElementById('username').focus();
    </script>
</body>
</html>
