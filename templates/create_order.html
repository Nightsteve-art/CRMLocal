{% extends "layout.html" %}

{% block title %}Новый заказ • Eko-Production CRM{% endblock %}

{% block content %}
<div class="fade-in">
    <div class="card" style="max-width: 1200px; margin: 0 auto;">
        <div class="card-header" style="padding: 1.5rem; border-bottom: 1px solid var(--gray-200);">
            <h1 style="font-size: 1.5rem; font-weight: 700; color: var(--gray-900); display: flex; align-items: center; gap: 0.5rem;">
                <i class="fas fa-plus-circle" style="color: var(--primary);"></i>
                Новый заказ
            </h1>
            <p style="color: var(--gray-600); font-size: 0.875rem; margin-top: 0.5rem;">
                Заполните информацию о заказе на материалы, расходники и комплектующие
            </p>
        </div>
        
        <div class="card-body" style="padding: 1.5rem;">
            <form method="POST" action="{{ url_for('create_order') }}" enctype="multipart/form-data" id="orderForm">
                <!-- Общая информация -->
                <div class="form-section" style="margin-bottom: 2rem;">
                    <div class="form-section-title">
                        <i class="fas fa-info-circle"></i>
                        Общая информация
                    </div>
                    <div class="form-grid" style="grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label for="manager_name" class="form-label">
                                Менеджер
                                <span class="form-hint">Исполнитель заказа</span>
                            </label>
                            <input type="text" 
                                   id="manager_name" 
                                   name="manager_name" 
                                   class="form-control" 
                                   value="{{ current_user.full_name or current_user.username }}"
                                   placeholder="ФИО менеджера">
                        </div>
                        
                        <div class="form-group">
                            <label for="notes" class="form-label">
                                Примечания
                                <span class="form-hint">Дополнительная информация о заказе</span>
                            </label>
                            <textarea id="notes" 
                                      name="notes" 
                                      class="form-control" 
                                      rows="2"
                                      placeholder="Особые требования, сроки, контакты..."></textarea>
                        </div>
                    </div>
                </div>
                
                <!-- Позиции заказа -->
                <div class="form-section" style="margin-bottom: 2rem;">
                    <div class="form-section-title">
                        <i class="fas fa-list-ul"></i>
                        Позиции заказа
                        <span id="itemsCount" style="margin-left: auto; font-size: 0.875rem; color: var(--gray-500);">
                            0 позиций
                        </span>
                    </div>
                    
                    <!-- Контейнер для позиций -->
                    <div id="orderItemsContainer">
                        <!-- Позиции будут добавляться динамически -->
                    </div>
                    
                    <!-- Кнопка добавления позиции -->
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <button type="button" class="btn btn-secondary" onclick="addOrderItem()">
                            <i class="fas fa-plus"></i>
                            Добавить позицию
                        </button>
                    </div>
                </div>
                
                <!-- Form actions -->
                <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--gray-200);">
                    <a href="{{ url_for('orders') }}" class="btn btn-secondary" style="padding: 0.75rem 1.5rem;">
                        <i class="fas fa-times"></i>
                        Отмена
                    </a>
                    <button type="submit" class="btn btn-primary" style="padding: 0.75rem 1.5rem;" id="submitBtn">
                        <i class="fas fa-save"></i>
                        Создать заказ
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Шаблон позиции заказа -->
<template id="orderItemTemplate">
    <div class="order-item" style="background: var(--white); border: 1px solid var(--gray-200); border-radius: var(--radius-md); padding: 1rem; margin-bottom: 1rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <h4 style="font-size: 1rem; font-weight: 600; color: var(--gray-800); margin: 0;">
                Позиция #<span class="item-number">1</span>
            </h4>
            <button type="button" class="btn btn-danger btn-sm" onclick="removeOrderItem(this)">
                <i class="fas fa-trash"></i>
            </button>
        </div>
        
        <div class="form-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
            <!-- Наименование -->
            <div class="form-group">
                <label class="form-label">
                    Наименование *
                    <span class="form-hint">Название товара или материала</span>
                </label>
                <input type="text" 
                       name="item_name[]" 
                       class="form-control item-name" 
                       required
                       placeholder="Например: Болт М8х30">
            </div>
            
            <!-- Количество -->
            <div class="form-group">
                <label class="form-label">
                    Количество *
                    <span class="form-hint">Требуемое количество</span>
                </label>
                <input type="number" 
                       name="item_quantity[]" 
                       class="form-control item-quantity" 
                       required
                       min="0.001"
                       step="0.001"
                       value="1"
                       placeholder="Например: 10">
            </div>
            
            <!-- Категория -->
            <div class="form-group">
                <label class="form-label">
                    Категория *
                    <span class="form-hint">Куда поступит товар</span>
                </label>
                <select name="item_category[]" class="form-control item-category" required>
                    <option value="расходники" selected>Расходники</option>
                    <option value="на склад">На склад</option>
                    <option value="метизы">Метизы</option>
                    <option value="электроника">Электроника</option>
                    <option value="инструменты">Инструменты</option>
                    <option value="прочее">Прочее</option>
                </select>
            </div>
            
            <!-- Цех -->
            <div class="form-group">
                <label class="form-label">
                    Цех/Отдел
                    <span class="form-hint">Для кого предназначен товар</span>
                </label>
                <input type="text" 
                       name="item_workshop[]" 
                       class="form-control item-workshop"
                       placeholder="Например: Швейный цех">
            </div>
            
            <!-- Ссылка -->
            <div class="form-group">
                <label class="form-label">
                    Ссылка
                    <span class="form-hint">Ссылка на товар в интернете</span>
                </label>
                <input type="url" 
                       name="item_link[]" 
                       class="form-control item-link"
                       placeholder="https://example.com/product">
            </div>
            
            <!-- Фото -->
            <div class="form-group">
                <label class="form-label">
                    Фото
                    <span class="form-hint">Изображение товара (опционально)</span>
                </label>
                <input type="file" 
                       name="item_photo[]" 
                       class="form-control item-photo"
                       accept="image/*">
                <div class="form-text" style="font-size: 0.75rem; color: var(--gray-500); margin-top: 0.25rem;">
                    JPG, PNG до 5MB
                </div>
            </div>
        </div>
    </div>
</template>

<script src="{{ url_for('static', filename='js/orders.js') }}"></script>

<style>
.form-section {
    background: var(--gray-50);
    border-radius: var(--radius-lg);
    padding: 1.5rem;
    border: 1px solid var(--gray-200);
}

.form-section-title {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--gray-800);
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.form-grid {
    display: grid;
    gap: 1rem;
}

.form-label {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    margin-bottom: 0.5rem;
    font-weight: 600;
    color: var(--gray-700);
    font-size: 0.875rem;
}

.form-hint {
    font-weight: normal;
    color: var(--gray-500);
    font-size: 0.75rem;
}

.form-control {
    width: 100%;
    padding: 0.75rem;
    border: 2px solid var(--gray-200);
    border-radius: var(--radius-md);
    font-size: 0.875rem;
    transition: all 0.2s ease;
}

.form-control:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1);
}

.order-item {
    transition: all 0.3s ease;
}

.order-item:hover {
    border-color: var(--primary-lighter);
    background: var(--primary-lighter);
}

@media (max-width: 768px) {
    .form-grid {
        grid-template-columns: 1fr !important;
    }
    
    .form-section {
        padding: 1rem;
    }
    
    .card-header, .card-body {
        padding: 1rem;
    }
}
</style>
{% endblock %}
